<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="t d"><title id="t">Inverting operational amplifier</title><desc id="d">Input voltage connects through 10 kiloohms to the negative terminal. Feedback of 30 kiloohms connects output to that node. Positive terminal is grounded. Supply rails are plus and minus 12 volts.</desc><rect width="640" height="260" rx="12" fill="white"/><g fill="none" stroke="#243047" stroke-width="2"><path d="M55 130H110M180 130H275M275 95V200L405 148Z M405 148H550M235 130V50H300M370 50H465V148 M235 50V130 M275 175H235V222M223 222H247M227 228H243M231 234H239"/><rect x="110" y="117" width="70" height="26"/><rect x="300" y="37" width="70" height="26"/></g><g fill="#243047" font-family="sans-serif" font-size="18"><text x="30" y="119">Vin</text><text x="117" y="105">10 kΩ</text><text x="302" y="27">30 kΩ</text><text x="286" y="136">−</text><text x="286" y="180">+</text><text x="515" y="137">Vout</text><text x="325" y="215">±12 V supplies</text></g></svg>
