<svg xmlns="http://www.w3.org/2000/svg" width="520" height="210" viewBox="0 0 520 210" role="img" aria-labelledby="t d"><title id="t">Three-variable Karnaugh map with wraparound adjacency</title><desc id="d">Rows A equal 0,1; columns BC equal 00,01,11,10 in Gray order. Ones occur at row A=0 columns 00 and 10, representing minterms 0 and 2. All other cells are zero.</desc><rect width="520" height="210" rx="10" fill="white"/><g fill="none" stroke="#243047"><path d="M110 70H470V170H110ZM110 120H470M200 70V170M290 70V170M380 70V170"/></g><g font-family="sans-serif" text-anchor="middle" font-size="20" fill="#243047"><text x="155" y="53">00</text><text x="245" y="53">01</text><text x="335" y="53">11</text><text x="425" y="53">10</text><text x="65" y="104">A=0</text><text x="65" y="154">A=1</text><text x="155" y="104">1</text><text x="245" y="104">0</text><text x="335" y="104">0</text><text x="425" y="104">1</text><text x="155" y="154">0</text><text x="245" y="154">0</text><text x="335" y="154">0</text><text x="425" y="154">0</text><text x="290" y="198">Columns: BC in Gray order</text></g></svg>
