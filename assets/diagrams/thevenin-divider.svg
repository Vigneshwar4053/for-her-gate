<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="t d"><title id="t">Open-circuit Thevenin voltage divider</title><desc id="d">An ideal 12 volt source positive terminal connects through a 2 kiloohm resistor to port a. A 4 kiloohm resistor connects a to common ground b. The load at a,b is disconnected.</desc><rect width="600" height="240" rx="12" fill="#fff"/><g stroke="#243047" fill="none" stroke-width="2"><path d="M90 66H165M235 66H370V93M370 153V195H90V143M90 93V66"/><circle cx="90" cy="118" r="25"/><rect x="165" y="53" width="70" height="26"/><rect x="357" y="93" width="26" height="60"/><path d="M370 66H500M370 195H500M80 111H100M90 101V121M80 131H100"/><circle cx="500" cy="66" r="4"/><circle cx="500" cy="195" r="4"/></g><g fill="#243047" font-family="sans-serif" font-size="18"><text x="32" y="124">12 V</text><text x="175" y="42">2 kΩ</text><text x="394" y="127">4 kΩ</text><text x="515" y="72">a (open)</text><text x="515" y="201">b</text></g></svg>
